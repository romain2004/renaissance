<!DOCTYPE html>
<!-- Page générée par tools/build-fashion.py — ne pas modifier à la main :
     changez fashion/seasons/<saison>/season.json ou tools/templates/season.html, puis relancez le script. -->
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0a0a0a">
  {{head_meta}}
  {{robots}}
  <link rel="icon" type="image/svg+xml" href="../../favicon.svg">
  <!-- site:head -->
  <!-- Commun à tout le site (tools/build-site.py) : police du logo, en-tête, écran de chargement -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500&display=swap">
  <link rel="stylesheet" href="/css/site.css?v=e0480b6a">
  <script>
    /* Écran de chargement : une fois par session, jamais si l'utilisateur réduit les animations.
       Il s'efface tout seul en CSS : même si le JavaScript échoue, il ne bloque rien. */
    try {
      if (!matchMedia('(prefers-reduced-motion: reduce)').matches && !sessionStorage.getItem('rm-loader')) {
        document.documentElement.classList.add('rm-loading');
        sessionStorage.setItem('rm-loader', '1');
      }
    } catch (e) {}
  </script>
  <!-- /site:head -->
  {{preload}}
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/seasons.css?v={{v_css}}">
</head>
<body class="page-season">

  <!-- site:header -->
  <div class="site-loader" aria-hidden="true"><span class="site-loader__name">Romain Maulavé</span></div>

  <header class="site-header" id="site-header">
    <a class="site-header__logo" href="/">Romain Maulavé</a>
    <nav class="site-header__nav" aria-label="Navigation">
      <a href="/fashion/" data-site-section="fashion">Fashion</a>
      <a href="/riviera/" data-site-section="riviera">Riviera</a>
      <a href="/contact/" data-site-section="contact">Contact</a>
    </nav>
    <div class="site-lang" role="group" aria-label="Langue / Language">
      <button type="button" class="site-lang__btn" data-site-lang="en">EN</button>
      <span class="site-lang__sep" aria-hidden="true">|</span>
      <button type="button" class="site-lang__btn" data-site-lang="fr">FR</button>
    </div>
    <button type="button" class="site-header__burger" aria-label="Menu" aria-expanded="false" aria-controls="site-menu"><span></span><span></span></button>
  </header>

  <div class="site-menu" id="site-menu">
    <a href="/fashion/">Fashion</a>
    <a href="/riviera/">Riviera</a>
    <a href="/contact/">Contact</a>
    <div class="site-lang" role="group" aria-label="Langue / Language">
      <button type="button" class="site-lang__btn" data-site-lang="en">EN</button>
      <span class="site-lang__sep" aria-hidden="true">|</span>
      <button type="button" class="site-lang__btn" data-site-lang="fr">FR</button>
    </div>
  </div>
  <!-- /site:header -->

  <main>
    <!-- Ouverture : 1 image plein écran + titre -->
    <section class="ss-opening">
      {{cover}}
      <div class="ss-opening__text">
        {{kicker}}
        <h1 class="ss-opening__title">{{title}}</h1>
      </div>
    </section>

    {{intro}}

    {{series}}

    {{backstage}}

    <nav class="ss-pager" aria-label="Saisons">
      {{pager}}
    </nav>
  </main>

  <footer>
    <span data-fr="© Romain Maulavé — Tous droits réservés" data-en="© Romain Maulavé — All rights reserved">© Romain Maulavé — Tous droits réservés</span>
    <a href="/contact/">hello@romainmaulave.com</a>
  </footer>

  <!-- Lightbox : flèches, clavier, glisser ; légende = marque · créateur · crédit -->
  <div class="lightbox ss-lightbox" id="season-lightbox" aria-hidden="true" role="dialog" aria-label="Photo">
    <div class="lightbox__backdrop"></div>
    <figure class="ss-lightbox__figure">
      <img class="ss-lightbox__img" alt="">
      <figcaption class="ss-lightbox__caption"></figcaption>
    </figure>
    <span class="ss-lightbox__counter"></span>
    <button class="ss-lightbox__close" type="button" aria-label="Fermer">&times;</button>
    <button class="ss-lightbox__nav ss-lightbox__nav--prev" type="button" aria-label="Photo précédente">&#8249;</button>
    <button class="ss-lightbox__nav ss-lightbox__nav--next" type="button" aria-label="Photo suivante">&#8250;</button>
  </div>

  <div class="grain" aria-hidden="true"></div>

  <script src="../js/main.js"></script>
  <script src="../js/seasons.js?v={{v_js}}"></script>
  <!-- site:scripts -->
  <script src="/js/site.js?v=1a05799a" defer></script>
  <!-- /site:scripts -->
</body>
</html>
