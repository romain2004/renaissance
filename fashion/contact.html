  <!-- ══ CONTACT ══════════════════════════════════════════════ -->
  <main class="contact-wrap">

    <!-- ── Left column: info & socials ───────────────────────── -->
    <div class="contact-info">
      <!-- Edit headline below -->
      <h1 class="contact-info__title reveal">
        Let's<br>Talk.
      </h1>

      <!-- Edit email address below -->
      <a href="mailto:hello@romainmaulave.com" class="contact-info__email reveal d1">
        hello@romainmaulave.com
      </a>

    </div>

    <!-- ── Right column: contact form ────────────────────────── -->
    <!--
      FORMSPREE SETUP (à faire une seule fois) :
      1. Va sur https://formspree.io et crée un compte gratuit
      2. Crée un nouveau form → copie ton endpoint (ex: https://formspree.io/f/xpwzabcd)
      3. Remplace l'URL ci-dessous par ton endpoint
      → Formspree enverra chaque message directement sur hello@romainmaulave.com
    -->
    <form class="contact-form reveal d1" action="https://formsubmit.co/hello@romainmaulave.com" method="POST" novalidate>

      <!-- FormSubmit config -->
      <input type="hidden" name="_captcha"  value="false">
      <input type="hidden" name="_subject"  value="Nouveau message — Portfolio RM">
      <input type="hidden" name="_template" value="table">

      <div class="form-group">
        <label for="name">Name</label>
        <input type="text" id="name" name="name" placeholder="Your name" required autocomplete="name">
      </div>

      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="your@email.com" required autocomplete="email">
      </div>

      <div class="form-group">
        <label for="subject">Subject</label>
        <select id="subject" name="subject" required>
          <option value="" disabled selected>Select a subject</option>
          <option value="fashion-week">Fashion Week Coverage</option>
          <option value="editorial">Editorial Shoot</option>
          <option value="film-video">Film / Video Project</option>
          <option value="collaboration">Collaboration</option>
          <option value="other">Other</option>
        </select>
      </div>

      <div class="form-group">
        <label for="message">Message</label>
        <textarea id="message" name="message" placeholder="Your message…" required></textarea>
      </div>

      <button type="submit" class="btn-submit">Send Message</button>

    </form>

  </main>

  <!-- ══ FOOTER ═══════════════════════════════════════════════ -->

  <div class="cursor-ring" id="cursor-ring" aria-hidden="true">
    <span class="cursor-label" id="cursor-label"></span>
  </div>

  <script src="js/main.js"></script>
</body>
