  <!-- ══ CONTACT : photos en fondu à gauche, formulaire à droite ═══════════ -->
  <main class="ct">

    <!-- 4 photos Fashion verticales en fondu lent ; sur mobile, une seule photo Fashion horizontale -->
    <section class="ct-visual" aria-label="Photographies">
      <div class="ct-slides" aria-hidden="true">
        <img src="images/contact/fashion-sequins.webp" alt="" width="1400" height="2224" fetchpriority="high">
        <img src="images/contact/fashion-manteau.webp" alt="" width="1400" height="2100" loading="lazy">
        <img src="images/contact/fashion-tulle.webp" alt="" width="1400" height="2100" loading="lazy">
        <img src="images/contact/fashion-fevrier-2025.webp" alt="" width="1400" height="2100" loading="lazy">
      </div>
      <img class="ct-mobile-img" src="images/contact/fashion-large.webp" alt="" width="1600" height="1066" aria-hidden="true">
      <h1 class="ct-title">
        <span data-fr="Parlons-" data-en="Let's ">Parlons-</span><span class="ct-title__accent" data-fr="en." data-en="talk.">en.</span>
      </h1>
    </section>

    <section class="ct-panel">
      <!--
        Envoi : l'adresse du service est dans data-endpoint (aujourd'hui FormSubmit, qui demande
        d'avoir validé une fois son e-mail d'activation). Pour passer à Web3Forms ou Formspree,
        on change seulement data-endpoint (et la clé d'accès), voir js/contact.js.
      -->
      <form class="ct-form" id="contact-form" novalidate
            data-endpoint="https://formsubmit.co/ajax/hello@romainmaulave.com">

        <!-- Champ piège anti-spam : invisible pour un humain, rempli par les robots -->
        <div class="ct-trap" aria-hidden="true">
          <label for="ct-website">Ne pas remplir</label>
          <input type="text" id="ct-website" name="_honey" tabindex="-1" autocomplete="off">
        </div>

        <div class="ct-field">
          <label for="ct-name" data-fr="Nom" data-en="Name">Nom</label>
          <input type="text" id="ct-name" name="name" required autocomplete="name">
        </div>

        <div class="ct-field">
          <label for="ct-email" data-fr="E-mail" data-en="Email">E-mail</label>
          <input type="email" id="ct-email" name="email" required autocomplete="email">
        </div>

        <fieldset class="ct-field ct-choices">
          <legend data-fr="Projet" data-en="Project">Projet</legend>
          <div class="ct-chips">
            <label class="ct-chip"><input type="radio" name="project" value="Fashion Week" required><span>Fashion Week</span></label>
            <label class="ct-chip"><input type="radio" name="project" value="Éditorial"><span data-fr="Éditorial" data-en="Editorial">Éditorial</span></label>
            <label class="ct-chip"><input type="radio" name="project" value="Campagne de marque"><span data-fr="Campagne de marque" data-en="Brand campaign">Campagne de marque</span></label>
            <label class="ct-chip"><input type="radio" name="project" value="Particulier"><span data-fr="Particulier" data-en="Private client">Particulier</span></label>
            <label class="ct-chip"><input type="radio" name="project" value="Établissement"><span data-fr="Établissement" data-en="Business">Établissement</span></label>
          </div>
        </fieldset>

        <div class="ct-field">
          <label for="ct-date"><span data-fr="Date ou période" data-en="Date or period">Date ou période</span> <span class="ct-optional" data-fr="(facultatif)" data-en="(optional)">(facultatif)</span></label>
          <input type="text" id="ct-date" name="date" autocomplete="off"
                 data-ph-fr="Ex. : 14 septembre, ou l'été 2027" data-ph-en="E.g. September 14, or summer 2027" placeholder="Ex. : 14 septembre, ou l'été 2027">
        </div>

        <div class="ct-field">
          <label for="ct-message" data-fr="Message" data-en="Message">Message</label>
          <textarea id="ct-message" name="message" rows="5" required></textarea>
        </div>

        <button type="submit" class="ct-submit" data-fr="Envoyer" data-en="Send">Envoyer</button>

        <p class="ct-status" role="status" aria-live="polite"></p>
      </form>

      <div class="ct-info">
        <p data-fr="Basé sur la Côte d'Azur · Disponible dans le monde entier" data-en="Based on the French Riviera · Available worldwide">Basé sur la Côte d'Azur · Disponible dans le monde entier</p>
        <p data-fr="Réponse sous 24 h" data-en="Reply within 24 h">Réponse sous 24 h</p>
        <p class="ct-links">
          <a href="mailto:hello@romainmaulave.com">hello@romainmaulave.com</a>
          <!-- Instagram : lien à ajouter quand Romain l'aura donné -->
          <a href="https://wa.me/33783716979">WhatsApp</a>
        </p>
      </div>
    </section>

  </main>
