<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-fr="Contact — Romain Maulavé" data-en="Contact — Romain Maulavé">Contact — Romain Maulavé</title>
  <meta name="description" content="Fashion Week, éditorial, campagne, Riviera : parlons de votre projet. Réponse sous 24 h."
        data-desc-fr="Fashion Week, éditorial, campagne, Riviera : parlons de votre projet. Réponse sous 24 h."
        data-desc-en="Fashion Week, editorial, campaign, Riviera: let's talk about your project. Reply within 24 h.">
  <link rel="canonical" href="https://www.romainmaulave.com/contact/">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="fr_FR">
  <meta property="og:site_name" content="Romain Maulavé">
  <meta property="og:title" content="Romain Maulavé · Parlons de votre projet">
  <meta property="og:description" content="Fashion Week, éditorial, campagne, Riviera. Basé sur la Côte d'Azur, disponible dans le monde entier.">
  <meta property="og:url" content="https://www.romainmaulave.com/contact/">
  <meta property="og:image" content="https://www.romainmaulave.com/images/share/home.jpg">
  <meta property="og:image:type" content="image/jpeg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="À gauche, un défilé de la New York Fashion Week ; à droite, un yacht à quai à Saint-Tropez">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <!-- site:head -->
  <!-- Commun à tout le site (tools/build-site.py) : police du logo, en-tête, écran de chargement -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500&display=swap">
  <link rel="stylesheet" href="/css/site.css?v=e0480b6a">
  <script>
    /* Écran de chargement : une fois par session, jamais si l'utilisateur réduit les animations.
       Il s'efface tout seul en CSS : même si le JavaScript échoue, il ne bloque rien. */
    try {
      if (!matchMedia('(prefers-reduced-motion: reduce)').matches && !sessionStorage.getItem('rm-loader')) {
        document.documentElement.classList.add('rm-loading');
        sessionStorage.setItem('rm-loader', '1');
      }
    } catch (e) {}
  </script>
  <!-- /site:head -->
  <link rel="stylesheet" href="contact.css">
</head>
<body class="page-contact">

  <!-- site:header -->
  <div class="site-loader" aria-hidden="true"><span class="site-loader__name">Romain Maulavé</span></div>

  <header class="site-header" id="site-header">
    <a class="site-header__logo" href="/">Romain Maulavé</a>
    <nav class="site-header__nav" aria-label="Navigation">
      <a href="/fashion/" data-site-section="fashion">Fashion</a>
      <a href="/riviera/" data-site-section="riviera">Riviera</a>
      <a href="/contact/" data-site-section="contact">Contact</a>
    </nav>
    <div class="site-lang" role="group" aria-label="Langue / Language">
      <button type="button" class="site-lang__btn" data-site-lang="en">EN</button>
      <span class="site-lang__sep" aria-hidden="true">|</span>
      <button type="button" class="site-lang__btn" data-site-lang="fr">FR</button>
    </div>
    <button type="button" class="site-header__burger" aria-label="Menu" aria-expanded="false" aria-controls="site-menu"><span></span><span></span></button>
  </header>

  <div class="site-menu" id="site-menu">
    <a href="/fashion/">Fashion</a>
    <a href="/riviera/">Riviera</a>
    <a href="/contact/">Contact</a>
    <div class="site-lang" role="group" aria-label="Langue / Language">
      <button type="button" class="site-lang__btn" data-site-lang="en">EN</button>
      <span class="site-lang__sep" aria-hidden="true">|</span>
      <button type="button" class="site-lang__btn" data-site-lang="fr">FR</button>
    </div>
  </div>
  <!-- /site:header -->

  <main class="ct">

    <!-- Moitié gauche : 4 photos en fondu lent (2 Fashion, 2 Riviera) ; sur mobile, une seule photo horizontale -->
    <section class="ct-visual" aria-label="Photographies">
      <div class="ct-slides" aria-hidden="true">
        <img src="images/fashion-cape.webp" alt="" width="1400" height="2100" fetchpriority="high">
        <img src="images/riviera-ponche.webp" alt="" width="1400" height="2100" loading="lazy">
        <img src="images/fashion-manteau.webp" alt="" width="1400" height="2100" loading="lazy">
        <img src="images/riviera-port.webp" alt="" width="1400" height="2100" loading="lazy">
      </div>
      <img class="ct-mobile-img" src="images/riviera-ponche-large.webp" alt="" width="1200" height="800" aria-hidden="true">
      <h1 class="ct-title">
        <span data-fr="Parlons-" data-en="Let's ">Parlons-</span><span class="ct-title__accent" data-fr="en." data-en="talk.">en.</span>
      </h1>
    </section>

    <!-- Moitié droite : le formulaire -->
    <section class="ct-panel">
      <!--
        Envoi : l'adresse du service est dans data-endpoint (aujourd'hui FormSubmit, qui demande
        d'avoir validé une fois son e-mail d'activation). Pour passer à Web3Forms ou Formspree,
        on change seulement data-endpoint (et la clé d'accès), voir js/contact.js.
      -->
      <form class="ct-form" id="contact-form" novalidate
            data-endpoint="https://formsubmit.co/ajax/hello@romainmaulave.com">

        <!-- Champ piège anti-spam : invisible pour un humain, rempli par les robots -->
        <div class="ct-trap" aria-hidden="true">
          <label for="ct-website">Ne pas remplir</label>
          <input type="text" id="ct-website" name="_honey" tabindex="-1" autocomplete="off">
        </div>

        <div class="ct-field">
          <label for="ct-name" data-fr="Nom" data-en="Name">Nom</label>
          <input type="text" id="ct-name" name="name" required autocomplete="name">
        </div>

        <div class="ct-field">
          <label for="ct-email" data-fr="E-mail" data-en="Email">E-mail</label>
          <input type="email" id="ct-email" name="email" required autocomplete="email">
        </div>

        <fieldset class="ct-field ct-choices">
          <legend data-fr="Projet" data-en="Project">Projet</legend>
          <div class="ct-chips">
            <label class="ct-chip"><input type="radio" name="project" value="Fashion Week" required><span>Fashion Week</span></label>
            <label class="ct-chip"><input type="radio" name="project" value="Éditorial"><span data-fr="Éditorial" data-en="Editorial">Éditorial</span></label>
            <label class="ct-chip"><input type="radio" name="project" value="Campagne de marque"><span data-fr="Campagne de marque" data-en="Brand campaign">Campagne de marque</span></label>
            <label class="ct-chip"><input type="radio" name="project" value="Particulier"><span data-fr="Particulier" data-en="Private client">Particulier</span></label>
            <label class="ct-chip"><input type="radio" name="project" value="Établissement"><span data-fr="Établissement" data-en="Business">Établissement</span></label>
          </div>
        </fieldset>

        <div class="ct-field">
          <label for="ct-date"><span data-fr="Date ou période" data-en="Date or period">Date ou période</span> <span class="ct-optional" data-fr="(facultatif)" data-en="(optional)">(facultatif)</span></label>
          <input type="text" id="ct-date" name="date" autocomplete="off"
                 data-fr="Ex. : 14 septembre, ou l'été 2027" data-en="E.g. September 14, or summer 2027" placeholder="Ex. : 14 septembre, ou l'été 2027">
        </div>

        <div class="ct-field">
          <label for="ct-message" data-fr="Message" data-en="Message">Message</label>
          <textarea id="ct-message" name="message" rows="5" required></textarea>
        </div>

        <button type="submit" class="ct-submit" data-fr="Envoyer" data-en="Send">Envoyer</button>

        <p class="ct-status" role="status" aria-live="polite"></p>
      </form>

      <div class="ct-info">
        <p data-fr="Basé sur la Côte d'Azur · Disponible dans le monde entier" data-en="Based on the French Riviera · Available worldwide">Basé sur la Côte d'Azur · Disponible dans le monde entier</p>
        <p data-fr="Réponse sous 24 h" data-en="Reply within 24 h">Réponse sous 24 h</p>
        <p class="ct-links">
          <a href="mailto:hello@romainmaulave.com">hello@romainmaulave.com</a>
          <!-- Instagram : lien à ajouter quand Romain l'aura donné -->
          <a href="https://wa.me/33783716979">WhatsApp</a>
        </p>
      </div>
    </section>

  </main>

  <footer class="ct-footer">
    <span data-fr="© Romain Maulavé — Tous droits réservés" data-en="© Romain Maulavé — All rights reserved">© Romain Maulavé — Tous droits réservés</span>
    <a href="mailto:hello@romainmaulave.com">hello@romainmaulave.com</a>
  </footer>

  <script src="contact.js" defer></script>
  <!-- site:scripts -->
  <script src="/js/site.js?v=1a05799a" defer></script>
  <!-- /site:scripts -->
</body>
</html>
